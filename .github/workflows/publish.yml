name: Publish to PyPI

# Publishes to PyPI when a version tag (v*) is pushed, using PyPI Trusted
# Publishing (OIDC) — no API token stored anywhere. The tag must match the
# version in pyproject.toml (e.g. bump to 0.2.0, commit, then tag v0.2.0).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + check tooling
        run: python -m pip install --upgrade pip build twine ruff pytest

      - name: Lint and test (never publish a broken build)
        run: |
          ruff check .
          pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi           # optional protection gate; configure in repo settings
    permissions:
      id-token: write           # required for OIDC trusted publishing
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
