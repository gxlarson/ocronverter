[project]
name = "ocronverter"
version = "0.1.0"
description = "Convert between OCR output formats via a neutral intermediate model."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors+warnings (E, W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry inherently long data lines (hOCR markup, coordinate
# arrays) that can't be wrapped without changing the fixture.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
