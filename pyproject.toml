[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocronverter"
version = "0.1.1"
description = "Convert between OCR output formats via a neutral intermediate model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Larson" }]
keywords = [
    "ocr", "conversion", "tesseract", "textract", "google-vision",
    "azure", "hocr", "easyocr", "bounding-box",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gxlarson/ocronverter"
Repository = "https://github.com/gxlarson/ocronverter"
Issues = "https://github.com/gxlarson/ocronverter/issues"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["ocronverter"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors+warnings (E, W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry inherently long data lines (hOCR markup, coordinate
# arrays) that can't be wrapped without changing the fixture.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["ocronverter"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
